[project]
name = "hawlak-agent"
version = "0.1.0"
description = "Approved-plan conversational follow-up calls for Hawlak"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.162.0",
    "livekit-agents[elevenlabs,openai]~=1.8",
    "pydantic>=2.12.0",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "ruff>=0.17.0",
]

[project.scripts]
hawlak-agent = "hawlak_agent.livekit_worker:main"
hawlak-agent-mock = "hawlak_agent.mock_cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
