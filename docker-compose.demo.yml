name: hawlak-demo

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hawlak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-hawlak}
    volumes:
      - demo_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [private]

  minio:
    image: minio/minio:latest
    command: server /data
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - demo_minio:/data
    networks: [private]

  minio-init:
    image: quay.io/minio/aistor/mc:RELEASE.2026-09-19T15-24-59Z
    depends_on: [minio]
    restart: "no"
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
    entrypoint: >
      /bin/sh -c '
      until mc alias set hawlak http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY"; do sleep 1; done;
      mc mb --ignore-existing "hawlak/$$S3_BUCKET";
      mc anonymous set none "hawlak/$$S3_BUCKET";
      '
    networks: [private]

  api:
    build: ./apps/api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hawlak}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hawlak}
      S3_ENDPOINT: http://minio:9000
      DASHBOARD_ORIGIN: https://${PUBLIC_HOSTNAME}
      PUBLIC_BASE_URL: https://${PUBLIC_HOSTNAME}
      HAWLAK_AGENT_CONTROL_URL: http://agent:3100
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    expose: ["3000"]
    networks: [private]

  webhook:
    build: ./apps/api
    restart: unless-stopped
    command: uvicorn app.webhook_main:app --host 0.0.0.0 --port 3001 --no-access-log
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hawlak}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hawlak}
      S3_ENDPOINT: http://minio:9000
      PUBLIC_BASE_URL: https://${PUBLIC_HOSTNAME}
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    expose: ["3001"]
    networks: [private]

  delivery-worker:
    build: ./apps/api
    restart: unless-stopped
    command: python -m app.delivery_worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hawlak}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hawlak}
      S3_ENDPOINT: http://minio:9000
      PUBLIC_BASE_URL: https://${PUBLIC_HOSTNAME}
      HAWLAK_AGENT_CONTROL_URL: http://agent:3100
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      agent:
        condition: service_started
    networks: [private]

  agent:
    build: ./apps/agent
    restart: unless-stopped
    env_file: .env
    environment:
      HAWLAK_API_BASE_URL: http://api:3000
      HAWLAK_INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      HAWLAK_AGENT_CONTROL_PORT: "3100"
    depends_on: [api]
    expose: ["3100"]
    networks: [private]

  voice-worker:
    build: ./apps/agent
    restart: unless-stopped
    command: hawlak-agent start
    env_file: .env
    environment:
      HAWLAK_API_BASE_URL: http://api:3000
      HAWLAK_INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
    depends_on: [api]
    networks: [private]

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    expose: ["80"]
    networks: [private]

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api, webhook, dashboard]
    networks: [private]

volumes:
  demo_postgres:
  demo_minio:
  caddy_data:
  caddy_config:

networks:
  private:
    driver: bridge
